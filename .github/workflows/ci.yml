name: CI

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # This was three jobs — lint, test, build — each with its own checkout,
    # Node setup and `npm ci`. On GitHub-hosted runners lint and test ran in
    # parallel and the split paid for itself. On the single self-hosted box
    # they queue behind one another, so the same commit installed dependencies
    # three times in a row to run three short commands.
    #
    # One job, one install. `!cancelled()` on each check keeps the property
    # that mattered about separate jobs: a lint failure still doesn't mask a
    # test failure, so one run reports every problem rather than one per push.
    verify:
        name: Lint, Test, Build
        runs-on: self-hosted
        timeout-minutes: 30
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: "npm"

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.11"
                  cache: pip

            - name: Install Dependencies (Node)
              run: npm ci
              env:
                  NPM_TOKEN: ${{ secrets.ACCESS_TOKEN }}

            - name: Install Dependencies (Python)
              run: pip install ruff

            - name: Run ESLint
              run: npm run lint

            - name: Run Ruff (Python Linter)
              if: ${{ !cancelled() }}
              run: ruff check .

            - name: Run Ruff (Python Formatter Check)
              if: ${{ !cancelled() }}
              run: ruff format --check .

            - name: Run Unit Tests
              if: ${{ !cancelled() }}
              run: npm run test:unit

            # Master only, as before — a full Next.js build is the most
            # expensive step here, and it holds the shared runner while every
            # other repo's jobs wait behind it.
            - name: Run build
              if: ${{ !cancelled() && github.ref == 'refs/heads/master' }}
              run: npm run build
