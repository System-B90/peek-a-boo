name: CI

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: Lint Codebase
        runs-on: self-hosted
        timeout-minutes: 15
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: "npm"

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install Dependencies (Node)
              run: npm ci
              env:
                  NPM_TOKEN: ${{ secrets.ACCESS_TOKEN }}

            - name: Install Dependencies (Python)
              run: pip install ruff

            - name: Run ESLint
              run: npm run lint

            - name: Run Ruff (Python Linter)
              run: ruff check .

            - name: Run Ruff (Python Formatter Check)
              run: ruff format --check .

    test:
        name: Unit Tests
        runs-on: self-hosted
        timeout-minutes: 25
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: "npm"

            - name: Install Dependencies
              run: npm ci
              env:
                  NPM_TOKEN: ${{ secrets.ACCESS_TOKEN }}

            - name: Run Unit Tests
              run: npm run test:unit

    build:
        name: Build
        needs: [lint, test]
        if: github.ref == 'refs/heads/master'
        runs-on: self-hosted
        timeout-minutes: 30
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci
              env:
                  NPM_TOKEN: ${{ secrets.ACCESS_TOKEN }}

            - name: Run build
              run: npm run build
