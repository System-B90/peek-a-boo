name: E2E Tests

on:
    workflow_dispatch:
    # Master only. Runs against the persistent shared Hive (see
    # System-B90/.github CLAUDE.md, "Shared persistent Hive"): one job at a
    # time across the org, 25 minutes each, so keep this suite small and
    # non-destructive. Use workflow_dispatch to run it against a branch.
    push:
        branches: [master]
        paths:
            - 'src/**'
            - 'tests/**'
            - 'websock/**'
            - 'nginx/**'
            - 'deploy/**'
            - 'scripts/**'
            - 'Dockerfile'
            - 'package.json'
            - 'package-lock.json'
            - '.github/workflows/e2e.yml'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    packages: read
    # shared-hive-acquire cancels this run if it holds Hive past 25 minutes.
    actions: write

jobs:
    e2e:
        name: E2E Tests (shared Hive)
        runs-on: [self-hosted, shared-hive]
        # Image builds (before the lock) + queueing for the lock + the 25m
        # Hive budget. The budget itself is enforced by shared-hive-acquire.
        timeout-minutes: 90
        env:
            NPM_TOKEN: ${{ secrets.ACCESS_TOKEN }}
            COMPOSE_PROJECT_NAME: peekaboo-test
            # The shared Hive runs as compose project "hive"; ui joins its
            # network to resolve the hive.org alias.
            HIVE_NETWORK_NAME: hive_hive-net

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            # ── Everything slow happens before taking the shared Hive ─────────
            - name: Generate self-signed SSL certificate
              run: |
                  mkdir -p nginx/ssl
                  openssl req -x509 -newkey rsa:4096 -keyout nginx/ssl/star.key \
                    -out nginx/ssl/star.crt -sha256 -days 30 -nodes \
                    -subj "/CN=peekaboo.dev" \
                    -addext "subjectAltName=DNS:peekaboo.dev,DNS:localhost"

            - name: Prepare websocket token file
              run: touch websock/websocket_token_source.txt

            - name: Install Python dependencies
              run: pip install -r scripts/requirements.txt

            - name: Set up Node + Playwright
              uses: System-B90/.github/actions/setup-playwright@main

            # Only NEXT_PUBLIC_HIVE_URL is baked in at build time, and it is
            # fixed. The real .env (SSO credentials) needs Hive, so it is
            # generated after acquiring it; this placeholder just lets the
            # compose files resolve for the build.
            - name: Build Peek-a-boo images
              run: |
                  echo "NEXT_PUBLIC_HIVE_URL='https://hive.org'" > .env
                  docker compose --env-file .env -f deploy/docker-compose.yml -f deploy/docker-compose.test.yml build

            # ── Shared Hive: exclusive, reset, 25-minute budget ──────────────
            - name: Acquire shared Hive
              uses: System-B90/.github/actions/shared-hive-acquire@main

            - name: Verify Hive 'api' account and generate .env
              run: python scripts/ci_setup.py

            - name: Start Peek-a-boo
              run: docker compose --env-file .env -f deploy/docker-compose.yml -f deploy/docker-compose.test.yml up -d --no-build

            - name: Wait for Peek-a-boo to be ready
              run: |
                  for i in $(seq 1 60); do
                    code=$(curl -ks -o /dev/null -w "%{http_code}" https://peekaboo.dev:8443/login || true)
                    if [ "$code" -ge 200 ] && [ "$code" -lt 500 ]; then
                      echo "Peek-a-boo is up (HTTP $code)"
                      exit 0
                    fi
                    echo "Attempt $i/60 - Peek-a-boo not ready yet (HTTP $code), waiting 5s..."
                    sleep 5
                  done
                  echo "::error::Peek-a-boo failed to become ready in time"
                  exit 1

            - name: Run E2E Tests
              run: npm run test:e2e
              env:
                  CI: true
                  BASE_URL: https://peekaboo.dev:8443

            - name: Dump Container Logs
              if: failure()
              run: |
                  mkdir -p container-logs
                  for c in $(docker ps -aq --filter "name=^/peekaboo-test-") $(docker ps -aq --filter "name=^/hive-core$"); do
                    name=$(docker inspect --format '{{.Name}}' "$c" | tr -d '/')
                    docker logs "$c" > "container-logs/$name.log" 2>&1 || true
                  done
                  echo "::group::Peek-a-boo ui container log (tail)"
                  docker logs --tail 400 peekaboo-test-ui 2>&1 || true
                  echo "::endgroup::"

            # Stop the app before releasing, so nothing talks to Hive while it
            # is reset. Only this app's stack — never prune here: the shared
            # Hive's containers are briefly stopped during a reset and a
            # container prune would delete them.
            - name: Stop Peek-a-boo
              if: always()
              run: docker compose --env-file .env -f deploy/docker-compose.yml -f deploy/docker-compose.test.yml down -v --remove-orphans || true

            - name: Release shared Hive
              if: always()
              uses: System-B90/.github/actions/shared-hive-release@main

            # ── Artifacts ────────────────────────────────────────────────────
            - name: Upload Playwright Report
              uses: actions/upload-artifact@v6
              if: ${{ !cancelled() }}
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 14

            - name: Upload Test Results
              uses: actions/upload-artifact@v6
              if: ${{ !cancelled() }}
              with:
                  name: test-results
                  path: test-results/
                  retention-days: 7

            - name: Upload Container Logs
              uses: actions/upload-artifact@v6
              if: failure()
              with:
                  name: container-logs
                  path: container-logs/
                  retention-days: 7
