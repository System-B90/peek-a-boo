name: E2E Tests

on:
    workflow_dispatch:
    pull_request:
        branches: [master]
    push:
        branches: [master]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    e2e:
        name: Full E2E Tests (with Hive)
        # The org is out of GitHub-hosted Actions minutes — everything runs on
        # the self-hosted pool.
        runs-on: self-hosted
        # 45 was calibrated when this ran on a fresh GitHub-hosted VM. On the
        # shared box it is not enough, and the job dies mid-build rather than
        # failing on anything real. Measured on 2026-08-04 (run 30862079400):
        # Set up Hive 8m52s, Set up Node + Playwright 8m57s, then "Build & start
        # Peek-a-boo" was still going at 24m14s when the ceiling killed it —
        # ~46m spent without reaching a single test.
        #
        # Bluz's equivalent job already uses 90, and peek-a-boo does comparable
        # work (it docker-builds nextjs, websock and nginx), so 45 was the
        # outlier. madash keeps 45 because it never docker-builds the app —
        # npm run build + next start on the host is far lighter.
        #
        # The 24-minute image build is the thing actually worth fixing; a build
        # cache would cut this far more than the ceiling does (System-B90/.github#12).
        timeout-minutes: 90
        env:
            NPM_TOKEN: ${{ secrets.ACCESS_TOKEN }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7


            # ── Hive (identity provider + organizational data) ────────────────
            # Shared org action: disk cleanup, token verify, Hive checkout,
            # commit-keyed image cache (or registry pull once Hive publishes
            # images), boot + init, readiness check. Hive repo/ref defaults
            # live in the action — one place to update for all consumer repos.
            - name: Set up Hive
              uses: System-B90/.github/actions/setup-hive@main
              with:
                  hive-token: ${{ secrets.ACCESS_TOKEN }}
                  image-source: registry
                  extra-hosts: 127.0.0.5 peekaboo.dev

            # Peek-a-boo authenticates end users directly against Hive's
            # /api/core/token/ (no OAuth) with a fixed HIVE_API_USERNAME=api
            # service account. Hive's init creates that user with an unknown
            # random password, so pin it here to a known value the rest of
            # the job can rely on.
            - name: Set Hive 'api' service account password
              working-directory: hive
              run: |
                  cat <<'PY' | docker compose -f docker-compose.yaml exec -T core python manage.py shell
                  from django.contrib.auth import get_user_model

                  User = get_user_model()
                  user = User.objects.get(username="api")
                  user.set_password("Password1")
                  user.save()
                  print("api service account password set")
                  PY

            - name: Install Python dependencies
              run: pip install -r scripts/requirements.txt

            - name: Verify Hive admin login via pyhive
              run: |
                  python - <<'PY'
                  from pyhive import HiveClient

                  with HiveClient("admin", "Password1", "https://hive.org", verify=False, timeout=30) as client:
                      print("Hive admin login OK. API version:", client.get_hive_version())
                  PY

            # ── Peek-a-boo environment & stack ─────────────────────────────────
            - name: Generate self-signed SSL certificate
              run: |
                  mkdir -p utils/certs
                  openssl req -x509 -newkey rsa:4096 -keyout utils/certs/star.key \
                    -out utils/certs/star.crt -sha256 -days 30 -nodes \
                    -subj "/CN=peekaboo.dev" \
                    -addext "subjectAltName=DNS:peekaboo.dev,DNS:wss.peekaboo.dev,DNS:localhost"

            - name: Prepare websocket token file
              run: touch websock/websocket_token_source.txt

            - name: Set up Node + Playwright
              uses: System-B90/.github/actions/setup-playwright@main

            - name: Verify Hive 'api' account and generate .env
              run: python scripts/ci_setup.py

            # Scoped to this step only — Hive's own docker compose invocation
            # (working-directory: hive) must not share this project name, or
            # Compose conflates its "nginx" service with ours and recreates
            # Hive's nginx container using our service definition.
            - name: Build & start Peek-a-boo
              env:
                  COMPOSE_PROJECT_NAME: peekaboo-test
                  NPM_TOKEN: ${{ secrets.ACCESS_TOKEN }}
              run: |
                  docker compose -f docker-compose.yml -f docker-compose.test.yml build
                  docker compose -f docker-compose.yml -f docker-compose.test.yml up -d

            - name: Wait for Peek-a-boo to be ready
              run: |
                  for i in $(seq 1 90); do
                    code=$(curl -ks -o /dev/null -w "%{http_code}" https://peekaboo.dev:8443/login || true)
                    if [ "$code" -ge 200 ] && [ "$code" -lt 500 ]; then
                      echo "Peek-a-boo is up (HTTP $code)"
                      exit 0
                    fi
                    echo "Attempt $i/90 - Peek-a-boo not ready yet (HTTP $code), waiting 5s..."
                    sleep 5
                  done
                  echo "::error::Peek-a-boo failed to become ready in time"
                  exit 1

            # ── Run Playwright tests ────────────────────────────────────────────
            - name: Run E2E Tests
              run: npm run test:e2e
              env:
                  CI: true
                  BASE_URL: https://peekaboo.dev:8443

            # ── Artifacts ────────────────────────────────────────────────────────
            - name: Upload Playwright Report
              uses: actions/upload-artifact@v6
              if: ${{ !cancelled() }}
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 14

            - name: Upload Test Results
              uses: actions/upload-artifact@v6
              if: ${{ !cancelled() }}
              with:
                  name: test-results
                  path: test-results/
                  retention-days: 7

            - name: Dump Container Logs
              if: failure()
              run: |
                  mkdir -p container-logs
                  docker ps -a
                  for c in $(docker ps -aq); do
                    name=$(docker inspect --format '{{.Name}}' "$c" | tr -d '/')
                    docker logs "$c" > "container-logs/$name.log" 2>&1 || true
                  done
                  echo "::group::Peek-a-boo nextjs container log (tail)"
                  docker logs --tail 400 peekaboo-test-nextjs 2>&1 || true
                  echo "::endgroup::"

            - name: Upload Container Logs
              uses: actions/upload-artifact@v6
              if: failure()
              with:
                  name: container-logs
                  path: container-logs/
                  retention-days: 7

            # ── Release the shared box ─────────────────────────────────────
            # Runs even when the tests fail: otherwise a dead Hive stack
            # occupies the shared runner until the next job happens to clear it
            # (System-B90/.github#12). Best-effort throughout — cleanup must not
            # turn a green run red.
            - name: Tear down Hive and reclaim disk
              if: always()
              run: |
                  docker compose -f docker-compose.yml -f docker-compose.test.yml down -v --remove-orphans || true
                  docker compose -f hive/docker-compose.yaml down -v --remove-orphans || true
                  leftovers=$(docker ps -aq --filter "name=^/hive-")
                  if [ -n "$leftovers" ]; then docker rm -f $leftovers || true; fi
                  docker container prune -f || true
                  docker volume prune -f || true
                  docker builder prune -f --keep-storage 10GB || true
                  df -h / || true
                  exit 0
              env:
                  COMPOSE_PROJECT_NAME: peekaboo-test
