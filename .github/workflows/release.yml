name: Build and Release Peek-a-boo

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_NEXTJS: system-b90/peek-a-boo/nextjs
  IMAGE_NAME_WEBSOCK: system-b90/peek-a-boo/websock
  # Public image required for the offline bundle
  IMAGE_NGINX: nginx:alpine

jobs:
  build-nextjs:
    name: Build NextJS Image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for NextJS Image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_NEXTJS }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push NextJS Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-websock:
    name: Build Websock Image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Websock Image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEBSOCK }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push Websock Image
        uses: docker/build-push-action@v7
        with:
          context: websock/
          file: websock/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  craft-release:
    name: Craft Release Packages
    needs: [build-nextjs, build-websock]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Workspace
        run: |
          mkdir -p release-online/images
          mkdir -p release-offline/images

          # Copy deployment scripts into both bundles
          cp scripts/install.sh deploy/docker-compose.yml scripts/requirements.txt setup.py release-online/
          cp scripts/install.sh deploy/docker-compose.yml scripts/requirements.txt setup.py release-offline/

      - name: Export Offline Images
        run: |
          TAG_NAME=${{ github.ref_name }}

          echo "Pulling freshly built custom images..."
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_NEXTJS }}:$TAG_NAME
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEBSOCK }}:$TAG_NAME

          echo "Pulling public proxy image..."
          docker pull ${{ env.IMAGE_NGINX }}

          echo "Saving custom images to flat archives..."
          docker save ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_NEXTJS }}:$TAG_NAME -o release-offline/images/peekaboo-nextjs.tar
          docker save ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEBSOCK }}:$TAG_NAME -o release-offline/images/peekaboo-websock.tar

          echo "Saving nginx image to flat archive..."
          docker save ${{ env.IMAGE_NGINX }} -o release-offline/images/nginx.tar

      - name: Compress Final Packages
        run: |
          tar -czvf peekaboo-online-${{ github.ref_name }}.tar.gz -C release-online .
          tar -czvf peekaboo-offline-${{ github.ref_name }}.tar.gz -C release-offline .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            peekaboo-online-${{ github.ref_name }}.tar.gz
            peekaboo-offline-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
