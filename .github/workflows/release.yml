name: Release

on:
    push:
        tags: ["v*"]
    workflow_dispatch:
        inputs:
            runner:
                description: 'Runner environment to execute on'
                required: false
                default: 'self-hosted'
                type: choice
                options:
                    - self-hosted
                    - github-hosted

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    REGISTRY: ghcr.io
    IMAGE_NAME_NEXTJS: system-b90/peek-a-boo/nextjs
    IMAGE_NAME_WEBSOCK: system-b90/peek-a-boo/websock

jobs:
    build-nextjs:
        name: Build NextJS Image
        runs-on: ${{ (inputs.runner == 'github-hosted' || vars.CI_RUNNER == 'github-hosted') && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux"]') }}
        timeout-minutes: 45
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata for NextJS Image
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_NEXTJS }}
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=ref,event=tag
                      type=sha,format=short

            - name: Build and push NextJS Image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: Dockerfile
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  build-args: |
                      NPM_TOKEN=${{ secrets.ACCESS_TOKEN }}

    build-websock:
        name: Build Websock Image
        runs-on: ${{ (inputs.runner == 'github-hosted' || vars.CI_RUNNER == 'github-hosted') && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux"]') }}
        timeout-minutes: 45
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata for Websock Image
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEBSOCK }}
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=ref,event=tag
                      type=sha,format=short

            - name: Build and push Websock Image
              uses: docker/build-push-action@v7
              with:
                  context: websock/
                  file: websock/Dockerfile
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    craft-release:
        name: Craft Release Packages
        needs: [build-nextjs, build-websock]
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ${{ (inputs.runner == 'github-hosted' || vars.CI_RUNNER == 'github-hosted') && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux"]') }}
        timeout-minutes: 45
        permissions:
            contents: write
            packages: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.11"

            # The bundles vendor the CLI wheel (app.json bundle.local_wheels)
            # and install it into the bundle's .venv (venv_packages).
            - name: Build Python CLI
              run: |
                  python -m pip install --upgrade pip build
                  python -m build cli/

            # Workspace prep, image export (read from docker-compose.release.yml),
            # wheel vendoring, the "wrong compose file / missing file" guards and the
            # versionless peekaboo/ packing all live in sb90-deploy now, driven by
            # deploy/app.json — shared with Bluz and madash.
            - name: Craft release bundles
              uses: System-B90/.github/actions/craft-release@main
              with:
                  tag: ${{ github.ref_name }}
                  out: .

            - name: Publish GitHub Release
              uses: softprops/action-gh-release@v3
              with:
                  files: |
                      peekaboo-online-${{ github.ref_name }}.tar.gz
                      peekaboo-offline-${{ github.ref_name }}.tar.gz
                      cli/dist/*
                  generate_release_notes: true
                  draft: false
                  prerelease: ${{ contains(github.ref_name, '-rc') }}

    publish-cli-index:
        name: Publish CLI to Org Pip Index
        needs: craft-release
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ${{ (inputs.runner == 'github-hosted' || vars.CI_RUNNER == 'github-hosted') && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux", "node", "python"]') }}
        timeout-minutes: 15

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.11"

            - name: Build Python CLI
              run: |
                  python -m pip install --upgrade pip build
                  python -m build cli/

            # Same PEP 503 index as pyhive, sb90-deploy and bluz-cli: served
            # from System-B90/.github by GitHub Pages, so `pip install
            # peekaboo-cli --extra-index-url https://system-b90.github.io/.github/pypi/`
            # works without access to this repo.
            - name: Checkout .github index repo
              uses: actions/checkout@v7
              with:
                  repository: System-B90/.github
                  token: ${{ secrets.CLASSIC_ACCESS_TOKEN || secrets.ACCESS_TOKEN }}
                  path: org-github

            - name: Copy distributions and regenerate index
              run: |
                  mkdir -p org-github/pypi/peekaboo-cli
                  cp cli/dist/* org-github/pypi/peekaboo-cli/
                  python org-github/pypi/generate_index.py peekaboo-cli

            - name: Commit and push index update
              working-directory: org-github
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add pypi/
                  git diff --cached --quiet && exit 0
                  git commit -m "Vibe-Updated pip index for peekaboo-cli ${{ github.ref_name }}"
                  git push
