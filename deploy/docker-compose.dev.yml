# Dev override: `npm run docker:dev`.
# Layered on deploy/docker-compose.yml — swaps the published ghcr images for
# locally built ones and live-syncs source into the containers.
name: peek-a-boo

services:
  ui:
    # Own tag so building the dev target never overwrites the prod image name.
    image: peekaboo-ui:dev
    build:
      context: ../
      dockerfile: Dockerfile
      target: dev
      secrets:
        - npm_token
    environment:
      - NODE_ENV=development
      # Behind nginx, so use its /ws route instead of bare-dev's direct :60800.
      - WEBSOCKET_URL=/ws
      # Bind-mounted/synced files on Docker Desktop (Windows/macOS) don't emit
      # inotify events reliably.
      - WATCHPACK_POLLING=true
    restart: "no"
    develop:
      watch:
        - action: sync
          path: ../src
          target: /app/src
        - action: sync
          path: ../public
          target: /app/public
        - action: sync+restart
          path: ../next.config.ts
          target: /app/next.config.ts
        - action: rebuild
          path: ../package.json
        - action: rebuild
          path: ../package-lock.json

  vnc-bridge:
    image: peekaboo-vnc-bridge:dev
    build:
      context: ../websock/
      dockerfile: Dockerfile
    restart: "no"
    ports: !override
      - "127.0.0.4:60800:60800"
    develop:
      watch:
        - action: sync+restart
          path: ../websock/start_websockify.py
          target: /app/start_websockify.py
        - action: rebuild
          path: ../websock/requirements.txt

  proxy:
    restart: "no"
    # Loopback alias so dev can coexist with Hive (127.0.0.6) and Bluz
    # (127.0.0.3) holding :80/:443 on their own addresses.
    ports: !override
      - "127.0.0.4:80:80"
      - "127.0.0.4:443:443"

secrets:
  # Build-time only; `python -m sb90_devops.with_npm_token` (npm scripts) or CI
  # exports NPM_TOKEN. Never an ARG/ENV, so it stays out of image layers.
  npm_token:
    environment: NPM_TOKEN
