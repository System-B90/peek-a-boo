name: peek-a-boo

services:
  ui:
    image: ghcr.io/system-b90/peek-a-boo/nextjs:${PEEKABOO_VERSION:-latest}
    container_name: peekaboo-ui
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - ../.env:/app/.env:ro
    expose:
      - "3000"
    healthcheck:
      # No curl/wget in the runner image; node is the only HTTP client.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - backend

  proxy:
    image: nginx:1.27-alpine
    container_name: peekaboo-proxy
    restart: always
    ports:
      - "${PEEKABOO_BIND_IP:-0.0.0.0}:${PEEKABOO_HTTPS_PORT:-443}:443"
      - "${PEEKABOO_BIND_IP:-0.0.0.0}:${PEEKABOO_HTTP_PORT:-80}:80"
    depends_on:
      ui:
        condition: service_healthy
      vnc-bridge:
        condition: service_started
    env_file:
      - ../.env
    environment:
      - SERVER_HOSTNAME=${HOSTNAME}
    volumes:
      - ../nginx/ssl:/etc/nginx/certs:ro
      - ../nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
    networks:
      - backend
      - frontend

  vnc-bridge:
    image: ghcr.io/system-b90/peek-a-boo/websock:${PEEKABOO_VERSION:-latest}
    container_name: peekaboo-vnc-bridge
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - ../websock/websocket_token_source.txt:/app/websocket_token_source.txt:ro
      - ../.env:/app/.env:ro
    ports:
      - "60800"
    networks:
      - backend

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
