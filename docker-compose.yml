services:
  nextjs:
    image: peekaboo/nextjs
    container_name: peekaboo_nextjs
    build:
      context: ./
      args:
        NODE_DOCKER_REGISTRY: ${NODE_DOCKER_REGISTRY}
        NPM_TOKEN: ${NPM_TOKEN}
        # NEXT_PUBLIC_* vars are inlined into the JS bundle at build time —
        # the runtime `environment:` block below can't override them.
        NEXT_PUBLIC_HIVE_URL: ${NEXT_PUBLIC_HIVE_URL}
      dockerfile: Dockerfile
    environment:
      - NODE_TLS_REJECT_UNAUTHORIZED=${NODE_TLS_REJECT_UNAUTHORIZED}
      - SYM_ENC_KEY=${SYM_ENC_KEY}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - HOSTNAME=${HOSTNAME}
      - WEBSOCKET_SERVER_HOSTNAME=${WEBSOCKET_SERVER_HOSTNAME}
      - VNC_CLIENT_PASSWORD=${VNC_CLIENT_PASSWORD}
      - HIVE_HOSTNAME=${HIVE_HOSTNAME}
      - HIVE_PASSWORD=${HIVE_PASSWORD}
      - HIVE_API_PASSWORD=${HIVE_API_PASSWORD}
      - NEXT_PUBLIC_HIVE_URL=${NEXT_PUBLIC_HIVE_URL}
      - HIVE_CLIENT_ID=${HIVE_CLIENT_ID}
      - HIVE_CLIENT_SECRET=${HIVE_CLIENT_SECRET}
      - MATTERMOST_URL=${MATTERMOST_URL}
      - MATTERMOST_ACCESS_TOKEN=${MATTERMOST_ACCESS_TOKEN}
      - TWEET_CHANNEL_ID=${TWEET_CHANNEL_ID}
    restart: always
    volumes:
      - ./.env:/app/.env:ro
    expose:
      - "3000"
    networks:
      - backend

  nginx:
    image: nginx:alpine
    container_name: peekaboo_nginx
    restart: always
    ports:
      - "443:443"
      - "80:80"
    depends_on:
      - nextjs
      - websock
    environment:
      - SERVER_HOSTNAME=${HOSTNAME}
      - WEBSOCKET_SERVER_HOSTNAME=${WEBSOCKET_SERVER_HOSTNAME}
    volumes:
      - ./utils/certs:/etc/nginx/certs:ro
      - ./scripts/configs/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
    networks:
      - backend
      - frontend

  websock:
    image: peekaboo/websock
    container_name: peekaboo_websock
    build:
      context: ./websock/
      args:
        PYTHON_DOCKER_REGISTRY: ${PYTHON_DOCKER_REGISTRY}
        PIP_CONF_PATH: ${PIP_CONF_PATH}
      dockerfile: Dockerfile
    restart: always
    volumes:
      - ./websock/websocket_token_source.txt:/app/websocket_token_source.txt:ro
      - ./.env:/app/.env:ro
    ports:
      - "60800"
    networks:
      - backend

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
