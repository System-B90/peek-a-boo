events {}

http {
    client_max_body_size 30M;

    server {
        listen 80;
        server_name peek-a-boo peek-a-boo.eshel.dom peek-a-boo.bis;
        return 301 https://peek-a-boo.eshel.dom$request_uri;
    }

    server {
        listen 443 ssl;
        server_name peek-a-boo.eshel.dom;

        ssl_certificate /etc/nginx/certs/star.peek-a-boo.eshel.dom.crt;
        ssl_certificate_key /etc/nginx/certs/star.peek-a-boo.eshel.dom.key;

        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout 5m;

        location / {
            proxy_pass http://peekaboo_nextjs:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
        }
    }

    server {
        listen 443 ssl;
        server_name peek-a-boo.bis;

        ssl_certificate /etc/nginx/certs/peek-a-boo.bis.crt;
        ssl_certificate_key /etc/nginx/certs/peek-a-boo.bis.key;

        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout 5m;

        location / {
            proxy_pass http://peekaboo_nextjs:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
        }
    }

    
    server {
        listen 443 ssl;
        server_name wss.peek-a-boo.eshel.dom;

        ssl_certificate /etc/nginx/certs/star.peek-a-boo.eshel.dom.crt;
        ssl_certificate_key /etc/nginx/certs/star.peek-a-boo.eshel.dom.key;

        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout 5m;

        location / {
            proxy_pass http://peekaboo_websock:60800;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
        }
    }
}
