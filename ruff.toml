extend-exclude = ["venv", "websock/venv", "utils/certs", "scripts/cnet"]

[lint]
# Pinned explicitly rather than inherited. CI installs ruff unpinned
# (`pip install ruff`), and ruff 0.16 widened its default rule set — the same
# unchanged tree that linted clean on 0.15.8 reports 28 errors on 0.16.1, in
# files nobody had touched. Selecting the rules here makes the result depend on
# this file instead of on whichever ruff pip resolved that morning.
#
# This list is ruff's own default through 0.15, so it preserves exactly what the
# repo has been linting under — it is not a relaxation.
#
# Adopting 0.16's broader defaults (UP/BLE/DTZ/I/EXE/PLW) is worth doing, but it
# is a deliberate change: 13 of the 28 are auto-fixable, the rest — utcnow()
# usage, blind excepts, a shebang on a non-executable file — need judgement.
# Widen this list when someone is ready to make those calls.
select = ["E4", "E7", "E9", "F"]
